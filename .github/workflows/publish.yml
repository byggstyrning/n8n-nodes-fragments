# Publishes the package to npm when a version tag (v1.2.3) is pushed, with an
# npm provenance statement proving it was built by this workflow from this
# repository and commit. npm only issues provenance for public repositories on
# GitHub-hosted runners.
#
# Auth, see RELEASING.md:
#   - first release: a short-lived granular token in the NPM_TOKEN secret
#     (Trusted Publishing can't be set up before the package exists);
#   - afterwards: npm Trusted Publishing (OIDC) for owner "byggstyrning",
#     repository "n8n-nodes-fragments", workflow "publish.yml"; delete NPM_TOKEN.

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1. Pinned to 11.x: npm 12 needs Node >= 22.22.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      - name: Publish (prepublishOnly runs typecheck, lint and test, which builds)
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
